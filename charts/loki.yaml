# Values for grafana-community/loki (chart v18.x).
# Reference: https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml
#
# Monolithic deployment, filesystem storage on a persistent EBS gp3 PVC.
# Logs survive pod restarts/reschedules. This is still single-node filesystem
# storage (not S3 / SimpleScalable) — appropriate for this scale; move to S3 +
# SimpleScalable for HA or high volume.
#
# Retention is configured below through loki_retention_period.

deploymentMode: Monolithic

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        object_store: filesystem
        store: tsdb
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Disable the auth_enabled=false path: alloy already sets the X-Scope-OrgID
  # header and Grafana is configured with httpHeaderName1, so leaving multi-
  # tenancy on keeps both producers and consumers consistent.
  auth_enabled: true

  # Log retention: the compactor deletes chunks older than retention_period,
  # keeping the PVC bounded. Loki requires delete_request_store when retention
  # is enabled; filesystem matches loki.storage.type. retention_period must be
  # 0 or a multiple of the 24h index period. limits_config here deep-merges
  # with the chart's defaults (adds retention_period, keeps the rest).
  limits_config:
    retention_period: ${loki_retention_period}
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    retention_delete_delay: 2h

# Scale all non-monolithic deployments to zero.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  # Persistent PVC for /var/loki (chunks + index). gp3 is WaitForFirstConsumer,
  # so the volume binds in the pod's AZ. This replaces the previous emptyDir
  # workaround (which existed only because the cluster had no StorageClass) —
  # the chart mounts this PVC at the Loki data dir, satisfying the writable
  # /var/loki that readOnlyRootFilesystem=true otherwise blocks.
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ${storage_class_name}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Disable optional components that add noise on a sandbox cluster and would
# require Prometheus Operator CRDs at install time.
monitoring:
  serviceMonitor:
    enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# The community chart enables a gateway metrics exporter by default.
# Keep the sandbox gateway without the extra exporter sidecar.
gateway:
  metrics:
    enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
