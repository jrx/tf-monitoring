# Values for prometheus-community/kube-prometheus-stack.
# Reference: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

crds:
  enabled: true

defaultRules:
  create: true

# n8n-specific alert rules. EDUCATIONAL ONLY: every rule carries
# `educational: "true"` and the Alertmanager route below sends that label to
# the `null` receiver, so they show up under Prometheus -> Alerts and in
# Grafana's alert list but never notify anyone. They exist to make the
# usage-tracking caveats visible (see the governance dashboard and the
# README): scrape gaps, leader count, statistics discontinuities, replica
# disagreement, DB pool pressure. Promote one by removing the label and
# adding a real receiver.
additionalPrometheusRulesMap:
  n8n-educational:
    groups:
      - name: n8n.educational
        rules:
          - alert: N8nMetricsTargetDown
            expr: up{job="n8n"} == 0
            for: 5m
            labels:
              severity: info
              educational: "true"
            annotations:
              summary: "n8n {{ $labels.component }} pod {{ $labels.pod }} not scraped for 5m"
              description: >-
                Prometheus cannot reach /metrics on this pod. Any usage figure
                derived from counters on it has a gap for this period; a later
                sample recovers the net change, not the per-day split.

          - alert: N8nLeaderCountNotOne
            expr: sum(n8n_instance_role_leader{job="n8n"}) != 1
            for: 5m
            labels:
              severity: info
              educational: "true"
            annotations:
              summary: "n8n multi-main leader count is {{ $value }} (must be exactly 1)"
              description: >-
                Leader-only metrics (n8n_workflow_info, n8n_active_workflow_info,
                pruning) are missing with 0 leaders and duplicated with 2+.

          - alert: N8nProductionStatisticsDecreased
            expr: >-
              max(n8n_production_root_executions{job="n8n"})
                < max(n8n_production_root_executions{job="n8n"} offset 10m)
            labels:
              severity: info
              educational: "true"
            annotations:
              summary: "n8n_production_root_executions went down"
              description: >-
                The lifetime statistics gauge is read from the database and
                must never decrease. A drop means a restore, a clone, a reset
                database or a pointed-elsewhere DB, not an ordinary pod
                restart. Do not clamp it to zero in usage reports; record a
                lineage boundary and investigate.

          - alert: N8nStatisticsReplicasDisagree
            expr: >-
              max(n8n_production_root_executions{job="n8n"})
                - min(n8n_production_root_executions{job="n8n"}) > 0
            for: 15m
            labels:
              severity: info
              educational: "true"
            annotations:
              summary: "n8n pods report different lifetime statistics for 15m"
              description: >-
                All pods read the same workflow_statistics table through a
                shared 300s cache, so they should agree within one cache
                interval. Persistent disagreement points at a pod on a stale
                cache or a different database. Never sum() these gauges across
                pods; take one value per logical instance.

          - alert: N8nDbPoolRequestsPending
            expr: max by (component) (n8n_db_pool_requests_pending{job="n8n"}) > 0
            for: 5m
            labels:
              severity: info
              educational: "true"
            annotations:
              summary: "n8n {{ $labels.component }} has requests waiting for a DB connection"
              description: >-
                n8n's own client-side pool is the ceiling (pool max is small
                by default). The database and PgBouncer can look idle while
                this is non-zero; see the Database & Pooling dashboard.

prometheus:
  prometheusSpec:
    retention: 15d
    # Persist the TSDB on an EBS gp3 PVC so metrics (and the spanmetrics RED
    # series) survive pod restarts/reschedules — without this the operator
    # uses emptyDir and `retention: 15d` is meaningless. Operator-managed
    # StatefulSet -> volumeClaimTemplate. gp3 is WaitForFirstConsumer, so the
    # volume binds in whatever AZ the pod schedules into (no AZ stranding).
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ${storage_class_name}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Scrape ServiceMonitor / PodMonitor / Probe / Rule objects from any
    # namespace, not just those matching the chart's release labels. This
    # lets other workloads ship monitoring config without coordinating
    # selectors with this stack.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

  # ServiceMonitors created alongside the kube-prometheus-stack release.
  # Nested under `prometheus:` (NOT top-level) — the chart moved this key
  # path between chart 76.x and 85.x; helm silently accepts an orphaned
  # top-level `additionalServiceMonitors:` as extra user data and renders
  # nothing, so the position matters.
  #
  # Placing scrape config here (instead of as standalone Terraform
  # resources) avoids the Prometheus-Operator-CRD-must-exist-at-plan-time
  # bootstrap problem and couples the lifecycle to the chart release.
  #
  # NB: the n8n workloads expose /metrics on port 5678 only when the n8n
  # pods are started with N8N_METRICS=true (set in the n8n workspace's
  # Helm values). The optional N8N_METRICS_INCLUDE_* families the n8n
  # Monitoring Pack dashboards read are also enabled there (see
  # local.n8n_metrics_env in the tf-n8n root module).
  additionalServiceMonitors:
    # All three n8n roles serve /metrics on 5678 (verified live on n8n
    # 2.39.6: main, webhook-processor and worker all return 200). The n8n
    # chart ships a Service for main and webhook-processor; the tf-n8n root
    # module adds a matching `n8n-worker` Service so this one selector
    # covers every role.
    #
    # Label contract the n8n Monitoring Pack dashboards depend on:
    #   job="n8n"            one job across all roles ($job is single-select)
    #   component=<role>     main | webhook-processor | worker
    # The chart's n8n-main Service carries no component label (its pods
    # do), so `component` is taken from the pod label, not the Service.
    - name: n8n
      namespaceSelector:
        matchNames:
          - n8n
      selector:
        matchLabels:
          app.kubernetes.io/name: n8n
          app.kubernetes.io/instance: n8n
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
          relabelings:
            - targetLabel: job
              replacement: n8n
            - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              targetLabel: component

    # KEDA underpins n8n's queue-mode worker autoscaling. Scrape the
    # operator-metrics-apiserver Service on its `metrics` (8080) port;
    # the `https` (443→6443) port on the same Service is the extension
    # API server, not Prometheus-format — do not scrape it.
    - name: keda
      namespaceSelector:
        matchNames:
          - keda
      selector:
        matchLabels:
          app: keda-operator-metrics-apiserver
      endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s

    # RED metrics derived from n8n's OpenTelemetry spans by the Jaeger
    # spanmetrics connector (see charts/jaeger.yaml). The connector's
    # prometheus exporter listens on the container's 8889, surfaced on the
    # chart's `jaeger` Service as the `span-metrics` port. These series feed
    # the n8n-traces dashboard. Empty until n8n tracing is enabled upstream.
    - name: jaeger-spanmetrics
      namespaceSelector:
        matchNames:
          - monitoring
      selector:
        matchLabels:
          app.kubernetes.io/instance: jaeger
          app.kubernetes.io/name: jaeger
      endpoints:
        - port: span-metrics
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s

alertmanager:
  # Route everything labelled educational="true" to the null receiver so the
  # rules above never notify, even after a real receiver is added to the
  # default route later. Helm replaces the `routes` list rather than merging
  # it, so the chart's default Watchdog route is repeated here.
  config:
    route:
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - educational = "true"
  alertmanagerSpec:
    # Persist silences + notification-dedup state across restarts.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ${storage_class_name}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

grafana:
  defaultDashboardsTimezone: utc

  # Normal sidecars in Grafana chart 13.2.5 both default to health port 8080.
  # They share the pod network, so give each health server a distinct port.
  # The chart's automatic HEALTH_PORT settings apply only to init sidecars.
  sidecar:
    dashboards:
      env:
        HEALTH_PORT: "8084"
    datasources:
      env:
        HEALTH_PORT: "8082"

  # Project the n8n-postgres-grafana Secret (managed by Terraform in
  # postgres-datasource.tf) into the Grafana container as the env var
  # N8N_POSTGRES_PASSWORD. The datasource provisioning YAML references
  # it as `$N8N_POSTGRES_PASSWORD` (Grafana resolves env-var refs in
  # provisioning YAML; the `$__file{}` syntax is NOT resolved there —
  # only in grafana.ini).
  envValueFrom:
    N8N_POSTGRES_PASSWORD:
      secretKeyRef:
        name: n8n-postgres-grafana
        key: password

  # Wire Loki and the n8n RDS Postgres database in as Grafana datasources
  # alongside the chart's built-in Prometheus datasource.
  #
  # Loki ships with multi-tenancy on; our Loki values file uses tenant_id
  # "1", so the X-Scope-OrgID header is set here. The n8n-postgres
  # datasource is for ad-hoc SQL in Explore; no shipped dashboard reads it
  # since governance moved to Prometheus.
  additionalDataSources:
    - name: Loki
      type: loki
      # Pin the UID so dashboards under ./dashboards/*.json can reference
      # `"uid": "loki"` literally. Same convention as `n8n-postgres` below
      # and the chart's built-in `prometheus` UID.
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: "1"
    - name: n8n-postgres
      type: postgres
      uid: n8n-postgres
      access: proxy
      url: ${n8n_db_host}:${n8n_db_port}
      user: ${n8n_db_user}
      # The default database needs to be set in BOTH places: top-level
      # `database` is the legacy `postgres` plugin field; `jsonData.database`
      # is what the modern `grafana-postgresql-datasource` plugin reads
      # (Grafana auto-migrates `type: postgres` to that plugin). Setting
      # only the top-level field makes panels with no per-target `dataset`
      # show "Configure a default database for the dashboard".
      database: ${n8n_db_name}
      jsonData:
        database: ${n8n_db_name}
        sslmode: require
        postgresVersion: 1500
      secureJsonData:
        password: $N8N_POSTGRES_PASSWORD
    - name: Jaeger
      type: jaeger
      # Pinned UID so anything referencing this datasource (trace links,
      # future dashboards) can use `jaeger` literally — same convention as
      # loki / prometheus / n8n-postgres above.
      uid: jaeger
      access: proxy
      # Jaeger all-in-one query API/UI (see charts/jaeger.yaml, jaeger.tf).
      url: http://jaeger.monitoring.svc.cluster.local:16686
      jsonData:
        # Coarse span -> logs jump: opens the Loki datasource over the span's
        # time window (+/- shift). n8n spans and n8n logs don't share an
        # indexed correlation key, so this is time-range based rather than
        # exact-match; still handy for "what was this execution logging?".
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          filterByTraceID: false
          filterBySpanID: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
