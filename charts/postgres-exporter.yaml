# Values for prometheus-community/prometheus-postgres-exporter.
# Reference: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-postgres-exporter/values.yaml
#
# Feeds the pg_stat_activity_count, pg_stat_database_* and
# pg_stat_user_tables_* series the n8n Monitoring Pack "Database & Pooling"
# dashboard reads. Those three collectors are on by default in
# postgres_exporter v0.20; no custom queries are configured.
#
# The exporter connects with n8n's application DB user, reusing the
# `n8n-postgres-grafana` Secret that the Grafana datasource already copies
# from the n8n workspace (postgres-datasource.tf). Same sandbox-only caveat
# as that datasource: swap in a read-only role with pg_monitor before this
# leaves the sandbox.

config:
  datasource:
    host: ${n8n_db_host}
    port: "${n8n_db_port}"
    user: ${n8n_db_user}
    database: ${n8n_db_name}
    passwordSecret:
      name: ${password_secret_name}
      key: password
    # RDS enforces TLS by default (rds.force_ssl=1 on PostgreSQL 15+).
    sslmode: require

serviceMonitor:
  enabled: true
  interval: 30s
  timeout: 10s

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi
